<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>ARC Agent — conversation log</title>
  <link rel="icon" href="Logos/favicon.jpg" type="image/jpeg">
  <style>
    :root {
      --bg: #0b0b0b;
      --panel: #121212;
      --panel-2: #181818;
      --line: #232323;
      --text: #e9e9e9;
      --muted: #8a8a8a;
      --accent: #b8ff3c;
      --user: #1d1f1d;
      --agent: #161616;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; font-size: 14px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .login {
      display: flex; align-items: center; justify-content: center; height: 100vh;
    }
    .login form {
      background: var(--panel); border: 1px solid var(--line); padding: 24px; border-radius: 4px; width: 320px;
    }
    .login h1 { margin: 0 0 16px; font-size: 14px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .login input { width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 3px; font-size: 14px; }
    .login button { margin-top: 12px; width: 100%; padding: 10px; background: var(--accent); color: #000; border: none; border-radius: 3px; font-weight: 600; cursor: pointer; }
    .login .err { color: #ff6b6b; margin-top: 10px; font-size: 12px; min-height: 1em; }

    .app { display: grid; grid-template-columns: 360px 1fr; height: 100vh; }
    .sidebar { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; }
    .sidebar header {
      padding: 14px 16px; border-bottom: 1px solid var(--line);
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; background: var(--panel); z-index: 1;
    }
    .sidebar header .title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .sidebar header .refresh { background: none; border: 1px solid var(--line); color: var(--muted); padding: 4px 10px; border-radius: 3px; font-size: 11px; cursor: pointer; }
    .sidebar header .refresh:hover { color: var(--accent); border-color: var(--accent); }
    .session {
      padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .12s;
    }
    .session:hover { background: var(--panel-2); }
    .session.active { background: var(--panel-2); border-left: 2px solid var(--accent); padding-left: 14px; }
    .session .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .session .when { font-size: 11px; color: var(--muted); }
    .session .who { font-weight: 500; font-size: 13px; word-break: break-all; }
    .session .meta { display: flex; gap: 8px; margin-top: 4px; font-size: 11px; color: var(--muted); }
    .session .badge { display: inline-block; padding: 1px 6px; border-radius: 2px; font-size: 10px; }
    .badge.booked { background: rgba(184, 255, 60, .15); color: var(--accent); }
    .badge.lang { background: var(--line); color: var(--muted); }

    .main { overflow-y: auto; padding: 24px 32px; }
    .empty { color: var(--muted); padding: 40px; text-align: center; }
    .convo-header { padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
    .convo-header .id { font-size: 11px; color: var(--muted); }
    .convo-header h2 { margin: 4px 0 0; font-size: 16px; font-weight: 500; }
    .msg { margin-bottom: 14px; padding: 12px 14px; border-radius: 6px; max-width: 760px; }
    .msg.user { background: var(--user); border: 1px solid var(--line); }
    .msg.assistant { background: var(--agent); border: 1px solid var(--line); }
    .msg .label { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
    .msg .body { white-space: pre-wrap; word-break: break-word; }
    .tool { margin-top: 8px; padding: 8px 10px; background: #0e0e0e; border: 1px solid var(--line); border-radius: 3px; font-size: 12px; }
    .tool .name { color: var(--accent); font-weight: 600; }
    .tool .ok { color: var(--accent); }
    .tool .err { color: #ff6b6b; }
    .tool pre { margin: 6px 0 0; font-size: 11px; color: var(--muted); white-space: pre-wrap; word-break: break-word; }

    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
    .topbar .brand { font-weight: 600; letter-spacing: .04em; }
    .topbar .logout { background: none; border: 1px solid var(--line); color: var(--muted); padding: 4px 10px; border-radius: 3px; font-size: 11px; cursor: pointer; }
    .topbar .logout:hover { color: var(--accent); border-color: var(--accent); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    var PASSWORD_KEY = 'arc_admin_pwd';

    function el(tag, attrs, children) {
      var n = document.createElement(tag);
      attrs = attrs || {};
      Object.keys(attrs).forEach(function (k) {
        if (k === 'class') n.className = attrs[k];
        else if (k === 'onclick') n.addEventListener('click', attrs[k]);
        else if (k === 'html') n.innerHTML = attrs[k];
        else n.setAttribute(k, attrs[k]);
      });
      (children || []).forEach(function (c) {
        if (c == null) return;
        if (typeof c === 'string') n.appendChild(document.createTextNode(c));
        else n.appendChild(c);
      });
      return n;
    }

    function fmtDate(iso) {
      if (!iso) return '—';
      var d = new Date(iso);
      return d.toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' });
    }

    function getPwd() {
      try { return sessionStorage.getItem(PASSWORD_KEY) || ''; } catch (e) { return ''; }
    }

    function setPwd(v) {
      try { sessionStorage.setItem(PASSWORD_KEY, v); } catch (e) {}
    }

    function clearPwd() {
      try { sessionStorage.removeItem(PASSWORD_KEY); } catch (e) {}
    }

    function api(path) {
      return fetch('/api/admin/conversations' + (path || ''), {
        headers: { 'X-Admin-Password': getPwd() }
      });
    }

    function renderLogin(errMsg) {
      var root = document.getElementById('root');
      root.innerHTML = '';
      var input = el('input', { type: 'password', placeholder: 'Admin password', autocomplete: 'current-password' });
      var err = el('div', { class: 'err' }, [errMsg || '']);
      var form = el('form', {}, [
        el('h1', {}, ['ARC agent — log']),
        input,
        el('button', { type: 'submit' }, ['Enter']),
        err,
      ]);
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!input.value) return;
        setPwd(input.value);
        boot();
      });
      var wrap = el('div', { class: 'login' }, [form]);
      root.appendChild(wrap);
      input.focus();
    }

    function renderApp(sessions) {
      var root = document.getElementById('root');
      root.innerHTML = '';

      var topbar = el('div', { class: 'topbar' }, [
        el('div', { class: 'brand mono' }, ['ARC // AGENT-LOG']),
        el('button', {
          class: 'logout',
          onclick: function () { clearPwd(); renderLogin(); }
        }, ['Log out'])
      ]);

      var sidebarHeader = el('header', {}, [
        el('div', { class: 'title mono' }, [String(sessions.length) + ' sessions']),
        el('button', { class: 'refresh mono', onclick: boot }, ['Refresh'])
      ]);

      var sessionsList = el('div', { class: 'sessions' }, []);
      sessions.forEach(function (s) {
        var badges = [];
        if (s.scheduled_call_at) badges.push(el('span', { class: 'badge booked mono' }, ['Booked']));
        if (s.lang) badges.push(el('span', { class: 'badge lang mono' }, [s.lang.toUpperCase()]));
        var who = s.visitor_email || ('anon · ' + s.session_id.slice(0, 8));
        var item = el('div', { class: 'session' }, [
          el('div', { class: 'row1' }, [
            el('div', { class: 'who' }, [who]),
            el('div', { class: 'when mono' }, [fmtDate(s.last_seen)])
          ]),
          el('div', { class: 'meta mono' }, [
            String(s.message_count) + ' msg',
            ...badges
          ])
        ]);
        item.addEventListener('click', function () {
          document.querySelectorAll('.session').forEach(function (n) { n.classList.remove('active'); });
          item.classList.add('active');
          openSession(s);
        });
        sessionsList.appendChild(item);
      });

      var sidebar = el('div', { class: 'sidebar' }, [sidebarHeader, sessionsList]);
      var main = el('div', { class: 'main', id: 'main' }, [
        el('div', { class: 'empty' }, ['Select a conversation to read it.'])
      ]);

      var app = el('div', {}, [
        topbar,
        el('div', { class: 'app', style: 'height: calc(100vh - 41px);' }, [sidebar, main])
      ]);
      root.appendChild(app);

      if (sessions.length > 0) {
        document.querySelector('.session').classList.add('active');
        openSession(sessions[0]);
      }
    }

    function openSession(session) {
      var main = document.getElementById('main');
      main.innerHTML = '<div class="empty">Loading…</div>';
      api('?session_id=' + encodeURIComponent(session.session_id))
        .then(function (r) { return r.json(); })
        .then(function (data) {
          main.innerHTML = '';
          var header = el('div', { class: 'convo-header' }, [
            el('div', { class: 'id mono' }, [session.session_id]),
            el('h2', {}, [session.visitor_email || 'Anonymous visitor']),
            el('div', { class: 'meta mono', style: 'color: var(--muted); font-size: 11px; margin-top: 4px;' }, [
              fmtDate(session.first_seen) + ' → ' + fmtDate(session.last_seen) + ' · ' +
              session.message_count + ' messages' +
              (session.scheduled_call_at ? ' · call ' + fmtDate(session.scheduled_call_at) : '')
            ])
          ]);
          main.appendChild(header);

          (data.messages || []).forEach(function (m) {
            var label = el('div', { class: 'label mono' }, [
              el('span', {}, [m.role.toUpperCase()]),
              el('span', {}, [fmtDate(m.ts)])
            ]);
            var body = el('div', { class: 'body' }, [m.content || '']);
            var msg = el('div', { class: 'msg ' + m.role }, [label, body]);

            if (m.tool_events && m.tool_events.length) {
              m.tool_events.forEach(function (te) {
                var status = te.success
                  ? el('span', { class: 'ok mono' }, ['✓ ok'])
                  : el('span', { class: 'err mono' }, ['✕ ' + (te.error || 'error')]);
                var tool = el('div', { class: 'tool' }, [
                  el('div', {}, [
                    el('span', { class: 'name mono' }, [te.name]),
                    ' — ',
                    status
                  ]),
                  el('pre', {}, [JSON.stringify(te.input, null, 2)])
                ]);
                msg.appendChild(tool);
              });
            }

            main.appendChild(msg);
          });

          if (!data.messages || data.messages.length === 0) {
            main.appendChild(el('div', { class: 'empty' }, ['No messages in this session.']));
          }
        })
        .catch(function (e) {
          main.innerHTML = '';
          main.appendChild(el('div', { class: 'empty' }, ['Error loading conversation: ' + e.message]));
        });
    }

    function boot() {
      if (!getPwd()) return renderLogin();
      api('').then(function (r) {
        if (r.status === 401) {
          clearPwd();
          renderLogin('Wrong password.');
          return null;
        }
        return r.json();
      }).then(function (data) {
        if (!data) return;
        if (data.error) {
          renderLogin(data.error);
          return;
        }
        renderApp(data.sessions || []);
      }).catch(function (e) {
        renderLogin('Connection error: ' + e.message);
      });
    }

    boot();
  </script>
</body>
</html>
