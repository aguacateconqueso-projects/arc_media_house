[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm install"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/admin/conversations"
  to = "/.netlify/functions/admin-conversations"
  status = 200

[dev]
  port = 3002
  targetPort = 3000
